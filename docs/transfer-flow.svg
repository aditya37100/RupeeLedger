<svg width="680" viewBox="0 0 680 710" role="img" xmlns="http://www.w3.org/2000/svg">
<title>ledger transfer flow</title>
<desc>A transfer request passes through the API into one Postgres transaction: lock account rows in sorted order, claim the idempotency key, check the balance, post the double entry, append an event to the outbox; after commit a relay publishes outbox events to Kafka.</desc>
<style>
  .th { font: 500 14px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
  .ts { font: 400 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #475569; }
  .note { font: 400 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #64748b; }
  .box  { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1; }
  .step { fill: #dbeafe; stroke: #3b82f6; stroke-width: 1; }
  .async{ fill: #ccfbf1; stroke: #0d9488; stroke-width: 1; }
  .arr  { stroke: #64748b; stroke-width: 1.5; fill: none; }
  .leader { stroke: #94a3b8; stroke-width: 0.75; stroke-dasharray: 3 3; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="0" y="0" width="680" height="710" fill="#ffffff"/>

<!-- architecture strip -->
<rect class="box" x="40" y="40" width="90" height="48" rx="6"/>
<text class="th" x="85" y="68" text-anchor="middle">Client</text>

<rect class="box" x="160" y="40" width="150" height="48" rx="6"/>
<text class="th" x="235" y="60" text-anchor="middle">API layer</text>
<text class="ts" x="235" y="76" text-anchor="middle">HTTP + gRPC</text>

<rect class="box" x="340" y="40" width="140" height="48" rx="6"/>
<text class="th" x="410" y="60" text-anchor="middle">Ledger core (Go)</text>
<text class="ts" x="410" y="76" text-anchor="middle">store.Transfer()</text>

<rect class="box" x="510" y="40" width="130" height="48" rx="6"/>
<text class="th" x="575" y="60" text-anchor="middle">Postgres</text>
<text class="ts" x="575" y="76" text-anchor="middle">source of truth</text>

<line class="arr" x1="130" y1="64" x2="156" y2="64" marker-end="url(#arrow)"/>
<line class="arr" x1="310" y1="64" x2="336" y2="64" marker-end="url(#arrow)"/>
<line class="arr" x1="480" y1="64" x2="506" y2="64" marker-end="url(#arrow)"/>

<!-- request enters the transaction -->
<line class="arr" x1="235" y1="88" x2="235" y2="126" marker-end="url(#arrow)"/>
<text class="ts" x="250" y="112">POST /transfers + Idempotency-Key header</text>

<!-- one transaction boundary -->
<rect x="40" y="130" width="360" height="436" rx="8" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text class="th" x="56" y="152">One Postgres transaction — BEGIN → COMMIT</text>

<!-- steps -->
<rect class="step" x="60" y="166" width="320" height="54" rx="6"/>
<text class="th" x="74" y="187">1 · Validate the request</text>
<text class="ts" x="74" y="204">amount &gt; 0 · from ≠ to · same currency</text>

<rect class="step" x="60" y="232" width="320" height="54" rx="6"/>
<text class="th" x="74" y="253">2 · Lock both account rows</text>
<text class="ts" x="74" y="270">SELECT … FOR UPDATE, sorted by id</text>

<rect class="step" x="60" y="298" width="320" height="54" rx="6"/>
<text class="th" x="74" y="317">3 · Claim the idempotency key</text>
<text class="ts" x="74" y="332">INSERT … ON CONFLICT DO NOTHING</text>
<text class="ts" x="74" y="346">duplicate key → return original (200)</text>

<rect class="step" x="60" y="364" width="320" height="54" rx="6"/>
<text class="th" x="74" y="385">4 · Check the balance</text>
<text class="ts" x="74" y="402">insufficient funds → 422, rollback</text>

<rect class="step" x="60" y="430" width="320" height="54" rx="6"/>
<text class="th" x="74" y="449">5 · Post the double entry</text>
<text class="ts" x="74" y="464">debit −X and credit +X</text>
<text class="ts" x="74" y="478">update both balances</text>

<rect class="step" x="60" y="496" width="320" height="54" rx="6"/>
<text class="th" x="74" y="517">6 · Append event to outbox</text>
<text class="ts" x="74" y="534">same transaction as the money</text>

<!-- side notes -->
<line class="leader" x1="380" y1="259" x2="412" y2="259"/>
<text class="note" x="418" y="255">deterministic lock order —</text>
<text class="note" x="418" y="269">deadlock-free by design</text>

<line class="leader" x1="380" y1="325" x2="412" y2="325"/>
<text class="note" x="418" y="321">safe retries — a replay returns</text>
<text class="note" x="418" y="335">the original transfer</text>

<line class="leader" x1="380" y1="391" x2="412" y2="391"/>
<text class="note" x="418" y="387">CHECK (balance_minor &gt;= 0)</text>
<text class="note" x="418" y="401">as the database-level backstop</text>

<line class="leader" x1="380" y1="457" x2="412" y2="457"/>
<text class="note" x="418" y="453">entries per transfer sum to zero —</text>
<text class="note" x="418" y="467">the books always balance</text>

<line class="leader" x1="380" y1="523" x2="412" y2="523"/>
<text class="note" x="418" y="519">transactional outbox — no</text>
<text class="note" x="418" y="533">dual-write problem</text>

<!-- commit and async publish -->
<line class="arr" x1="145" y1="566" x2="145" y2="592" marker-end="url(#arrow)"/>
<text class="ts" x="158" y="584">COMMIT → 201 Created to client</text>

<rect class="async" x="60" y="596" width="170" height="48" rx="6"/>
<text class="th" x="145" y="616" text-anchor="middle">Outbox table</text>
<text class="ts" x="145" y="632" text-anchor="middle">unpublished events</text>

<rect class="async" x="280" y="596" width="150" height="48" rx="6"/>
<text class="th" x="355" y="616" text-anchor="middle">Relay</text>
<text class="ts" x="355" y="632" text-anchor="middle">polls, marks sent</text>

<rect class="async" x="480" y="596" width="120" height="48" rx="6"/>
<text class="th" x="540" y="616" text-anchor="middle">Kafka</text>
<text class="ts" x="540" y="632" text-anchor="middle">consumers</text>

<line class="arr" x1="230" y1="620" x2="276" y2="620" marker-end="url(#arrow)"/>
<line class="arr" x1="430" y1="620" x2="476" y2="620" marker-end="url(#arrow)"/>

<text class="ts" x="60" y="668">At-least-once delivery + idempotent consumers ⇒ behaves as exactly-once.</text>
<text class="note" x="60" y="688">Blue = inside one DB transaction · Teal = async, after commit</text>
</svg>
